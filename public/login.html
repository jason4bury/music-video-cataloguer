<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Music Video Cataloguer</title>
<style>
  :root {
    --bg: #15130f;
    --surface: #1e1b16;
    --surface-raised: #262219;
    --border: #343025;
    --text: #f2ece0;
    --text-dim: #a89e8d;
    --amber: #e8a33d;
    --amber-dim: #a97a34;
    --red: #d3564a;
    --radius: 3px;
    --font-display: 'Arial Narrow', 'Helvetica Neue Condensed', Impact, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    background-image: radial-gradient(ellipse at top left, rgba(232, 163, 61, 0.06), transparent 55%);
    color: var(--text);
    font-family: var(--font-body);
  }
  .card {
    width: min(340px, calc(100vw - 40px));
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 26px 26px;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 20px;
    color: var(--amber);
    margin: 0 0 4px;
  }
  p.sub { color: var(--text-dim); font-size: 12.5px; margin: 0 0 22px; }
  label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; }
  input {
    width: 100%;
    padding: 9px 11px;
    margin-bottom: 14px;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 14px;
  }
  input:focus { outline: none; border-color: var(--amber-dim); }
  button {
    width: 100%;
    padding: 10px;
    background: var(--amber);
    border: 1px solid var(--amber);
    border-radius: var(--radius);
    color: #1a1610;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  #error {
    display: none;
    color: var(--red);
    font-size: 12.5px;
    margin-bottom: 14px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🎬 Music Videos</h1>
    <p class="sub">Sign in to view your collection</p>
    <div id="error"></div>
    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit" id="submitBtn">Sign in</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('error');
    const submitBtn = document.getElementById('submitBtn');
    const params = new URLSearchParams(location.search);
    const redirectTo = params.get('redirect') && params.get('redirect').startsWith('/') ? params.get('redirect') : '/';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || 'Sign in failed');
        }
        location.href = redirectTo;
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
