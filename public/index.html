<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Music Video Cataloguer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1>🎬 Music Videos</h1>
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Search artist or title…" autocomplete="off" />
      </div>
      <div class="topbar-actions">
        <button id="favToggle" class="chip-toggle" title="Show only favorites">★ Favorites</button>
        <button id="logoutBtn" title="Sign out">⏻ Sign out</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <section>
          <h2>Playlists</h2>
          <ul id="playlistList" class="playlist-list">
            <li data-playlist="" class="active">All Videos</li>
          </ul>
          <form id="newPlaylistForm" class="inline-form">
            <input id="newPlaylistName" placeholder="New playlist…" required />
            <button type="submit">+</button>
          </form>
        </section>

        <section>
          <h2>Artists</h2>
          <ul id="artistList" class="filter-list"></ul>
        </section>

        <section>
          <h2>Tags</h2>
          <ul id="tagList" class="filter-list"></ul>
        </section>

        <section id="scanSection" class="hidden">
          <h2>Scan</h2>
          <div class="scan-progress-track">
            <div id="scanProgressFill" class="scan-progress-fill"></div>
          </div>
          <p id="scanProgressLabel" class="scan-progress-label"></p>
        </section>
      </aside>

      <main>
        <div class="toolbar">
          <span id="resultCount" class="result-count"></span>
          <label class="sort-label">
            Sort
            <select id="sortSelect">
              <option value="artist">Artist</option>
              <option value="title">Title</option>
              <option value="added">Recently Added</option>
              <option value="duration">Duration</option>
            </select>
          </label>
        </div>
        <div id="grid" class="grid"></div>
        <div id="emptyState" class="empty-state hidden">No videos match your filters yet.</div>
      </main>
    </div>
  </div>

  <div id="playerModal" class="modal hidden">
    <div class="modal-content">
      <button id="closeModal" class="modal-close">✕</button>
      <video id="player" controls></video>
      <div class="modal-info">
        <div class="modal-title-row">
          <div>
            <h2 id="modalTitle"></h2>
            <p id="modalArtist" class="modal-artist"></p>
          </div>
          <div class="modal-buttons">
            <button id="modalFav" class="chip-toggle">★ Favorite</button>
            <button id="modalWatched" class="chip-toggle">✓ Watched</button>
          </div>
        </div>
        <div class="tag-editor">
          <div id="modalTags" class="tag-list"></div>
          <form id="addTagForm" class="inline-form">
            <input id="addTagInput" placeholder="Add tag…" />
            <button type="submit">Add</button>
          </form>
        </div>
        <div class="playlist-add">
          <label>
            Add to playlist
            <select id="playlistSelect"></select>
          </label>
          <button id="addToPlaylistBtn">Add</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
